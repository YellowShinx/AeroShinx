<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroShinx's Airpedia - Airline</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="hero-bg"></div>
    <div class="blob blob-1"></div>
    
    <div class="wrapper">
        <a href="../index.html" class="back-link" data-es="← Volver al inicio" data-en="← Back to home">← Volver al inicio</a>
        
        <header>
            <h2 data-es="Aerolínea" data-en="Section: Airline">Airline</h2>
            <div class="header-controls">
                <form class="search-box" onsubmit="handleSearch(event, '../')">
                    <input type="text" id="searchInput" placeholder="Search / Buscar...">
                    <button type="submit">🔍</button>
                </form>
                <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">EN / ES</button>
            </div>
        </header>

        <main class="content-grid">
            <div class="glass-card">
                <img src="../Fotos/airline-1.jpg" alt="Airline Photo" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1569154941061-e231b4725ef1?w=500&auto=format&fit=crop&q=60'">
                <div class="card-body">
                    <span class="badge" data-es="Flota" data-en="Fleet">Fleet</span>
                    <h3><a href="ryanair.html" style="color: inherit; text-decoration: none;">Ryanair</a></h3>
                    <p data-es="Análisis fotográfico y técnico de aviones de doble pasillo." data-en="Photographic and technical analysis of twin-aisle aircraft.">Análisis fotográfico y técnico de aviones de doble pasillo.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/search.js"></script>
</body>
</html>
